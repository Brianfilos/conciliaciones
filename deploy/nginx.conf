# Configuración de Nginx para la app de conciliaciones
# Copiar a: /etc/nginx/sites-available/conciliaciones
# Activar con: sudo ln -s /etc/nginx/sites-available/conciliaciones /etc/nginx/sites-enabled/
# Recargar:    sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name TU_DOMINIO_O_IP;   # <-- cambiar

    # Archivos estáticos servidos directamente por Nginx (más rápido que Whitenoise)
    location /static/ {
        alias /home/ubuntu/app-conciliaciones/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Archivos subidos por usuarios
    location /media/ {
        alias /home/ubuntu/app-conciliaciones/media/;
    }

    # Todo lo demás va a Gunicorn
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Límite para subida de archivos Excel (ajustar según necesidad)
        client_max_body_size 50M;
        proxy_read_timeout   120s;
    }
}
