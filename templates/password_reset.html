<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><title>Recuperar contraseña</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
{% load static %}<link rel="stylesheet" href="{% static 'css/main.css' %}">
<style>body{background:#f0f4f8;display:flex;align-items:center;justify-content:center;min-height:100vh;}</style>
</head><body>
<div class="card shadow-sm" style="max-width:420px;width:100%;">
  <div class="card-header text-white" style="background:#1B3A6B;"><h5 class="mb-0">Recuperar contraseña</h5></div>
  <div class="card-body">
    <p class="small text-muted">Ingrese su correo registrado y le enviaremos instrucciones.</p>
    <form method="post">{% csrf_token %}
      <div class="mb-3"><input type="email" name="email" class="form-control" placeholder="Correo electrónico" required></div>
      <button type="submit" class="btn btn-primary w-100">Enviar</button>
    </form>
    <div class="text-center mt-3"><a href="{% url 'login' %}" class="small">Volver al login</a></div>
  </div>
</div>
</body></html>
