<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><title>Nueva contraseña</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head><body style="background:#f0f4f8;display:flex;align-items:center;justify-content:center;min-height:100vh;">
<div class="card shadow-sm p-4" style="max-width:420px;width:100%;">
  <h5>Establecer nueva contraseña</h5>
  <form method="post">{% csrf_token %}
    {% for field in form %}
    <div class="mb-3"><label class="form-label small">{{ field.label }}</label>{{ field }}</div>
    {% endfor %}
    <button type="submit" class="btn btn-primary w-100">Guardar contraseña</button>
  </form>
</div>
</body></html>
